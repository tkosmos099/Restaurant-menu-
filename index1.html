const $=id=>document.getElementById(id),stage=$('stage'),book=$('book'),leaf=$('leaf'),left=$('left'),right=$('right'),particles=$('particles');let index=0,p=0,drag=false,dir=1,busy=false,raf=0,timer=0,down=null,zoomTimer=0;
function el(tag,cls,txt){const n=document.createElement(tag);if(cls)n.className=cls;if(txt!==undefined)n.textContent=txt;return n}
function render(target,i){const data=pages[i];target.replaceChildren();target.append(el('div','eyebrow',data[1]),el('h2','heading',data[0]),el('div','rule'));if(data[2]!==null){const img=el('img','photo');img.src=photos[data[2]];img.alt=data[0];img.draggable=false;target.append(img)}for(const [name,desc,price] of data[3]){const item=el('div','item'),top=el('div','top');top.append(el('span','name',name),el('span','price',price));item.append(top,el('div','desc',desc));target.append(item)}target.append(el('div','footer','✦ Smacznego! ✦'))}
function clearAssembly(){clearTimeout(timer);particles.replaceChildren();book.querySelectorAll('.content *').forEach(e=>e.style.visibility='visible')}
function show(){render(left,index*2);render(right,index*2+1);leaf.style.display='none';busy=false;$('count').textContent=(index+1)+' / 4'}
function prepare(d){if(index+d<0||index+d>3)return false;clearAssembly();dir=d;render(left,d===1?index*2:(index+d)*2);render(right,d===1?(index+d)*2+1:index*2+1);leaf.style.left=d===1?'50%':'0%';leaf.style.transformOrigin=d===1?'left center':'right center';leaf.style.display='block';busy=true;return true}
function draw(v){p=Math.max(0,Math.min(1,v));leaf.style.transform='rotateY('+(dir===1?-180*p:180*p)+'deg)';const s=Math.sin(p*Math.PI);leaf.style.filter=`drop-shadow(${dir*s*8}px 2px ${s*12+1}px #000b)`}
function animate(to,done){cancelAnimationFrame(raf);const start=performance.now(),from=p;function frame(t){const q=Math.min(1,(t-start)/600);draw(from+(to-from)*(1-Math.pow(1-q,3)));if(q<1)raf=requestAnimationFrame(frame);else{if(done)done();else show()}}raf=requestAnimationFrame(frame)}
function assemble(side){const target=side==='left'?left:right,br=book.getBoundingClientRect(),els=[...target.querySelectorAll('.heading,.eyebrow,.name,.price,.desc')];for(const e of els){const r=e.getBoundingClientRect(),s=getComputedStyle(e);e.style.visibility='hidden';const n=el('span','particle',e.textContent);Object.assign(n.style,{left:(r.left-br.left)+'px',top:(r.top-br.top)+'px',width:r.width+'px',font:s.font,color:s.color,textAlign:s.textAlign,lineHeight:s.lineHeight});n.style.setProperty('--dx',((Math.random()-.5)*br.width)+'px');n.style.setProperty('--dy',((Math.random()-.5)*br.height)+'px');n.style.setProperty('--rot',((Math.random()-.5)*90)+'deg');n.style.setProperty('--delay',(Math.random()*90)+'ms');n.style.setProperty('--dur',(300+Math.random()*130)+'ms');particles.append(n)}timer=setTimeout(()=>{particles.replaceChildren();els.forEach(e=>e.style.visibility='visible')},630)}
function finish(d){index+=d;show();assemble(d===1?'left':'right')}
function flip(d){if(busy||!prepare(d))return;draw(0);animate(1,()=>finish(d))}
function coord(e){const r=book.getBoundingClientRect();return(e.clientX-r.left)/r.width}
function tapZoom(){clearTimeout(zoomTimer);book.classList.remove('tap');void book.offsetWidth;book.classList.add('tap');zoomTimer=setTimeout(()=>book.classList.remove('tap'),220)}
stage.addEventListener('pointerdown',e=>{if(busy||down)return;down={id:e.pointerId,x:e.clientX,y:e.clientY};stage.setPointerCapture(e.pointerId)});
stage.addEventListener('pointermove',e=>{if(!down||e.pointerId!==down.id)return;const dx=e.clientX-down.x,dy=e.clientY-down.y;if(!drag){if(Math.abs(dx)<15||Math.abs(dx)<Math.abs(dy)*1.2)return;const d=dx<0?1:-1;if(!prepare(d))return;drag=true;book.classList.remove('tap')}const x=coord(e);draw(dir===1?Math.max(0,(1-x)*1.2):Math.max(0,x*1.2))});
stage.addEventListener('pointerup',e=>{if(!down||e.pointerId!==down.id)return;down=null;if(!drag){tapZoom();return}drag=false;if(p>.35)animate(1,()=>finish(dir));else animate(0)});
stage.addEventListener('pointercancel',()=>{down=null;if(drag){drag=false;animate(0)}});
$('next').addEventListener('click',()=>flip(1));$('prev').addEventListener('click',()=>flip(-1));show();
</script></body></html>
